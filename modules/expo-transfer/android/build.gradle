plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.skepi.transfer'
version = '0.0.0'

android {
  namespace "org.skepi.transfer"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  // BuildConfig.DEBUG gates the P2P fault injection (debug builds only, used by the E2E).
  buildFeatures {
    buildConfig true
  }
}

dependencies {
  // QR encode and decode (Apache-2.0, pure Java: no Play Services, no network).
  implementation "com.google.zxing:core:3.5.3"
  // QR scanning preview and frames (Apache-2.0).
  implementation "androidx.camera:camera-camera2:1.4.2"
  implementation "androidx.camera:camera-lifecycle:1.4.2"
  implementation "androidx.camera:camera-view:1.4.2"

  // Transfer server/client instrumentation tests (src/androidTest, run with connectedAndroidTest).
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test:core:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
