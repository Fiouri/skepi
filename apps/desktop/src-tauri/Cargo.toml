[package]
name = "skepi-desktop"
version = "0.1.0"
description = "SKEPI for Windows: offline knowledge, maps, AI with sources, Station mode"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "skepi_desktop_lib"
crate-type = ["rlib"]

[features]
default = ["vulkan"]
# llama.cpp GPU offload (Vulkan SDK at build time); `--no-default-features` builds the CPU-only app.
vulkan = ["desktop-core/vulkan"]
# Debug builds only (build.rs refuses it in release): trust the local HTTPS test mirror CA.
test-mirror = ["desktop-core/test-mirror"]

[dependencies]
desktop-core = { path = "../../../crates/desktop-core", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "time"] }
percent-encoding = "=2.3.2"

[target.'cfg(windows)'.dependencies]
# Same versions as wry/tauri: WebView2 settings tauri does not expose (src/webview2.rs).
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
ed25519-dalek = "=3.0.0"
base64 = "=0.23.1"
serde_json = "=1.0.151"

[lints]
workspace = true
