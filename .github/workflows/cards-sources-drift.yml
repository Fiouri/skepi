# Weekly drift check of the public-domain web sources of the emergency cards (CDC, FEMA Ready.gov;
# decision 2026-10-21) and of the official sources of the emergency numbers (pages and PDFs, 2026-10-24):
# re-fetches each one; a file with the snapshot's SHA-256 is unchanged, only a different file is extracted
# and its text compared with the committed snapshot (tools/cards-source-check/snapshots/); reports a number
# no longer shown. The CDC asks reusers to check its pages for revisions. Never blocks anything: on a real
# text change the job stays green, writes a warning annotation and opens (or comments on) one issue
# labelled "cards-source-drift" with the changed passages. A source that cannot be fetched (HTTP 403) is
# listed as unchecked in the job summary, no issue. The job fails when the drift command cannot compare:
# a pdftotext version other than the PDF snapshots' (Poppler of this runner image), or any error.
# Nothing is updated automatically: the owner decides, and a card changes only by a reviewed commit.
# Actions are pinned to commit SHAs (supply chain, docs/architecture.md).
name: Card sources drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    # Pinned image: its Poppler (24.02.0) wrote the PDF snapshots; a newer one fails the job, not drift.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Re-fetch the card and emergency-number sources and compare them with the snapshots
        id: drift
        run: |
          # The runner image's apt index can be stale (404 on superseded .debs): refresh it, retry once.
          for attempt in 1 2; do
            sudo apt-get update -q && sudo apt-get install -y -q poppler-utils && break
            [ "$attempt" -eq 2 ] && exit 1
            sleep 15
          done
          rc=0
          node node_modules/tsx/dist/cli.mjs tools/cards-source-check/src/cli.ts drift --report drift.md || rc=$?
          # 0: no text change (unchecked sources listed); 1: a real text change; anything else: fail.
          [ -f drift.md ] && cat drift.md >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drifted=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      - name: Open or update the drift issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning title=Emergency card sources drifted::The text of a card or emergency-number source changed since its snapshot; see the job summary."
          printf '\n[Workflow run](%s)\n' "$RUN_URL" >> drift.md
          gh label create cards-source-drift --color d93f0b --description "A web source of the emergency cards changed" 2>/dev/null || true
          issue=$(gh issue list --label cards-source-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file drift.md
          else
            gh issue create --title "Emergency card sources changed (CDC / Ready.gov)" --label cards-source-drift --body-file drift.md
          fi
