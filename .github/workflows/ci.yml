# CI: typecheck, lint, unit tests and the committed-fixtures check (verify, every change); the rag-eval
# smoke subset (llama.cpp on CPU), the Android release guards (unsigned release APK, permission allowlist,
# release JS bundle rebuild probe, draft emergency cards gate) and the Windows desktop crates (skipped
# when only docs change); the reproducible unsigned APK is android-repro.yml. The full rag-eval run and
# Android Maestro E2E run locally (phase reports).
# Phase 3b-0: the Apple jobs on GitHub's macOS runners (no Mac, no signing): ios-build (Simulator Release
# build, Swift unit tests, bundle scan, link checks; on its path filter), ios-e2e (the ad-hoc signed
# Simulator copy built by ios-build, Maestro flows, retrieval parity with the stored S23/desktop/eval runs;
# nightly on main, on workflow_dispatch and on pull requests labelled "ios-e2e") and desktop-macos (Rust
# gates, unsigned Tauri build with Metal, egress check). The nightly run starts the Apple jobs only.
# Actions are pinned to commit SHAs (supply chain, docs/architecture.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding the "ios-e2e" label starts the iOS E2E job on the pull request.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly on the default branch (main): Apple jobs only.
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      cold:
        description: 'iOS jobs without caches (restore nothing, save nothing): cold timing run'
        type: boolean
        default: false

permissions:
  contents: read

# Superseded pull-request runs are cancelled; pushes to main are not (a docs-only push would otherwise
# cancel the previous push's code checks and then skip them).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter: a change that touches only docs/** or *.md files skips the heavy jobs (rag-eval smoke,
  # Android release guards, Windows desktop); verify always runs. Unknown bases (new branch, force push
  # without history) count as code changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ios: ${{ steps.diff.outputs.ios }}
      ios_e2e: ${{ steps.diff.outputs.ios_e2e }}
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          E2E_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ios-e2e') }}
        run: |
          # iOS E2E (Maestro + retrieval parity): nightly, on demand, and on pull requests labelled "ios-e2e"
          # (which also forces ios-build, whose Simulator apps it installs).
          ios_e2e=false
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ "$E2E_LABEL" = true ]; then ios_e2e=true; fi
          echo "ios_e2e=$ios_e2e" >> "$GITHUB_OUTPUT"
          # Apple jobs (Phase 3b-0) follow their own paths: never docs-only changes.
          IOS_PATHS='^(apps/mobile/(app\.json|package\.json|metro\.config\.js|plugins/)|apps/mobile/ios/|modules/|native/kiwix/|e2e/ios/|packages/emergency-cards/|catalog/|pnpm-lock\.yaml$|(.*/)?Podfile(\.lock)?$|\.github/workflows/ci\.yml$)'
          MACOS_PATHS='^(crates/|apps/desktop/|native/kiwix/|Cargo\.(toml|lock)$|\.cargo/|rustfmt\.toml$|packages/emergency-cards/|catalog/|\.github/workflows/ci\.yml$)'
          if [ "$EVENT" = schedule ]; then
            echo "nightly: Apple jobs only"; echo "code=false" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "manual run: every job"; echo "code=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "base unknown: running every job"; echo "code=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          code=$(echo "$files" | grep -v -E '^docs/|\.md$' | grep -c . || true)
          if [ -z "$files" ] || [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "docs only: heavy jobs skipped"; echo "code=false" >> "$GITHUB_OUTPUT"; fi
          ios=$(echo "$files" | grep -v -E '\.md$' | grep -c -E "$IOS_PATHS" || true)
          macos=$(echo "$files" | grep -v -E '\.md$' | grep -c -E "$MACOS_PATHS" || true)
          echo "ios=$([ "$ios" -gt 0 ] || [ "$ios_e2e" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "macos=$([ "$macos" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every file the test catalogs, manifests and tests use is committed
        run: pnpm --filter @skepi/catalog-builder exec tsx src/cli.ts check-fixtures
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Developer Preview: the desktop UI bundle built with SKEPI_PREVIEW=1 holds no emergency-card step.
      - name: Preview desktop bundle has no card advice text
        run: |
          SKEPI_PREVIEW=1 pnpm --filter @skepi/desktop build
          node node_modules/tsx/dist/cli.mjs tools/release-guards/src/preview-cards-cli.ts apps/desktop/dist

  rag-eval-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKEPI_CACHE_DIR: ${{ github.workspace }}/.cache/skepi
      SKEPI_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/rag-eval/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r tools/rag-eval/requirements.txt
      - name: Tiny GGUF metadata
        id: model
        run: |
          echo "file=$(jq -r .evalTinyModel.file scripts/content.lock.json)" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r .evalTinyModel.url scripts/content.lock.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .evalTinyModel.sha256 scripts/content.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/skepi
          key: eval-model-${{ steps.model.outputs.sha256 }}
      - name: Download and verify the tiny GGUF
        run: |
          mkdir -p "$SKEPI_CACHE_DIR"
          target="$SKEPI_CACHE_DIR/${{ steps.model.outputs.file }}"
          if [ ! -f "$target" ]; then
            curl --fail --location --retry 5 --output "$target.partial" "${{ steps.model.outputs.url }}"
            mv "$target.partial" "$target"
          fi
          echo "${{ steps.model.outputs.sha256 }}  $target" | sha256sum --check
      - name: rag-eval smoke subset
        run: pnpm --filter @skepi/rag-eval exec tsx src/cli.ts --smoke --threads 4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rag-eval-smoke
          path: tools/rag-eval/out/
          if-no-files-found: ignore

  android-release-guards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Native code (llama.rn built from source, op-sqlite/SQLCipher, React Native) compiles through ccache:
    # CMake 3.17+ reads CMAKE_<LANG>_COMPILER_LAUNCHER from the environment, so the NDK builds that the
    # Android Gradle plugin starts pick it up without touching generated or third-party build files.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 1500M
      # The Android Gradle plugin installs NDK 27.1 on every run (not in the runner image), so the
      # compiler's mtime changes: hash its content instead (first warm run had 0 cross-run hits).
      CCACHE_COMPILERCHECK: content
      # Codegen headers are regenerated each run; their fresh mtimes would disable direct-mode hits.
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # At most two native links at once (scripts/ci/link-slot.sh): with a warm ccache, parallel
      # ld.lld runs of ~2.4 GB each exhausted 16 GB RAM + 10 GB swap and the runner was lost.
      CMAKE_C_LINKER_LAUNCHER: ${{ github.workspace }}/scripts/ci/link-slot.sh
      CMAKE_CXX_LINKER_LAUNCHER: ${{ github.workspace }}/scripts/ci/link-slot.sh
      SKEPI_LINK_SLOTS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      # Gradle User Home: dependencies, wrapper, transforms and the local build cache (enabled below with
      # --build-cache); written on main only.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Insurance only: the out-of-memory losses of the runner (parallel ld.lld with a warm ccache) are
      # fixed by the link slots below; with them the build peaks at ~9.3 GB of 16 GB and uses no swap.
      - name: Swap (10 GB)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/skepi.swap
          sudo chmod 600 /mnt/skepi.swap
          sudo mkswap /mnt/skepi.swap > /dev/null
          sudo swapon /mnt/skepi.swap
          free -m
      - name: ccache
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache
          ccache --version | head -n 1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-android-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-android-v2-${{ hashFiles('pnpm-lock.yaml') }}-
            ccache-android-v2-
      - run: ccache --zero-stats
      - name: Link slots self-test (4 x 2 s jobs, 2 slots -> ~4 s; exit codes pass through)
        run: |
          start=$(date +%s)
          for i in 1 2 3 4; do scripts/ci/link-slot.sh sleep 2 & done
          wait
          took=$(( $(date +%s) - start ))
          echo "took ${took}s"
          [ "$took" -ge 4 ] && [ "$took" -le 6 ]
          rc=0; scripts/ci/link-slot.sh sh -c 'exit 7' || rc=$?
          [ "$rc" -eq 7 ]
      - run: pnpm install --frozen-lockfile
      - name: Expo prebuild (android/ is generated, never committed)
        run: pnpm --filter @skepi/mobile run prebuild
      - name: Release build must fail with draft emergency cards
        working-directory: apps/mobile/android
        run: |
          if ./gradlew skepiCheckEmergencyCards --build-cache --console=plain > gate.log 2>&1; then
            cat gate.log
            echo "::error::the draft-cards gate let a release build through"
            exit 1
          fi
          cat gate.log
          grep -q "emergency cards are DRAFT" gate.log
      # Developer Preview mode (what ships): no card steps in the bundle, checked by Gradle right after
      # the JS bundle is built (skepiCheckPreviewBundle -> tools/release-guards preview-cards).
      # Unsigned (-PskepiUnsigned=true): CI holds no key, not even the debug key; the reproducible APK that
      # gets signed for release comes from .github/workflows/android-repro.yml.
      - name: Release APK, Developer Preview (unsigned)
        working-directory: apps/mobile/android
        env:
          SKEPI_PREVIEW: '1'
        run: ./gradlew assembleRelease -PskepiUnsigned=true -PskepiPreview=true --build-cache --console=plain
      - name: ccache statistics
        if: always()
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than 7d
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .ccache
          key: ccache-android-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Permission allowlist (aapt2 dump permissions)
        run: |
          apk=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -n 1)
          node node_modules/tsx/dist/cli.mjs tools/release-guards/src/permissions-cli.ts "$apk" --app-id org.skepi.app
      - name: Release JS bundle rebuilds on packages/ and modules/ changes
        run: node node_modules/tsx/dist/cli.mjs tools/release-guards/src/bundle-probe-cli.ts

  # Phase 3a: the Windows desktop crates (zim-ffi, desktop-core, the Tauri shell). libzim comes from the
  # pinned official Windows build (native/kiwix, SHA-256 checked); llama.cpp is built with Vulkan (pinned
  # LunarG SDK, native/vulkan) and CPU-only.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SKEPI_CACHE_DIR: ${{ github.workspace }}\.cache\skepi
      SKEPI_LIBZIM_DIR: ${{ github.workspace }}\.cache\libzim
      SKEPI_VULKAN_DIR: ${{ github.workspace }}\.cache\vulkan-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.98.1 --profile minimal -c rustfmt -c clippy
          rustup default 1.98.1
      # Cargo registry + dependency build output, including llama-cpp-sys-2's CMake build (CPU and
      # Vulkan, the slowest part). rust-cache keys on the toolchain, Cargo.lock and Cargo.toml files;
      # the key adds the llama.cpp crate and the native inputs (libzim, Vulkan SDK). Saved even when a
      # later step fails, so a red run does not throw the llama.cpp build away.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llama-cpp-sys-2-0.1.159-${{ hashFiles('native/kiwix/libzim-windows.lock.json', 'native/vulkan/vulkan-sdk-windows.lock.json') }}
          cache-on-failure: 'true'
      - name: libzim (official Windows build, SHA-256 pinned)
        shell: pwsh
        run: ./native/kiwix/fetch-libzim-windows.ps1
      # The same Vulkan-enabled llama.cpp as local builds: LunarG SDK pinned by SHA-256, pruned to what
      # ggml-vulkan's CMake build uses (~40 MB) and cached by the lock file.
      - id: vulkan-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\.cache\vulkan-sdk
          key: vulkan-sdk-${{ hashFiles('native/vulkan/vulkan-sdk-windows.lock.json', 'native/vulkan/fetch-vulkan-sdk.ps1') }}
      - name: Vulkan SDK (LunarG, SHA-256 pinned)
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./native/vulkan/fetch-vulkan-sdk.ps1
      - name: VULKAN_SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:SKEPI_VULKAN_DIR\Bin\glslc.exe")) { throw 'Vulkan SDK missing' }
          "VULKAN_SDK=$env:SKEPI_VULKAN_DIR" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Desktop UI build (frontend embedded by the Tauri shell)
        run: pnpm --filter @skepi/desktop build
      - name: Third-party notices are current (JavaScript + Rust)
        run: pnpm --filter @skepi/notices check
      - run: cargo fmt --all -- --check
      # Cargo steps run in the MSVC environment with Ninja for CMake (scripts/with-msvc.ps1): with the
      # Visual Studio generator, ggml-vulkan's shader-generator sub-build fails its install step.
      - name: Clippy (default build, Vulkan)
        shell: pwsh
        run: ./scripts/with-msvc.ps1 cargo clippy --workspace --all-targets '--' -D warnings
      - name: Clippy (CPU-only build)
        shell: pwsh
        run: ./scripts/with-msvc.ps1 cargo clippy --workspace --all-targets --no-default-features '--' -D warnings
      - name: Tests (Vulkan build)
        shell: pwsh
        run: ./scripts/with-msvc.ps1 cargo test --workspace
      - name: CPU-only build (no Vulkan, no Vulkan SDK)
        shell: pwsh
        env:
          VULKAN_SDK: ''
        run: ./scripts/with-msvc.ps1 cargo build -p skepi-desktop --no-default-features
      - name: Downloads against the local HTTPS test mirror (Node)
        shell: pwsh
        run: ./scripts/with-msvc.ps1 cargo test -p desktop-core --features test-mirror --test downloads

  # Phase 3b-0: the iOS app on the Simulator (macOS runner, no signing, no TestFlight). CoreKiwix
  # (libzim 9.7.0) from the official Kiwix xcframework, SHA-256 pinned in native/kiwix; llama.rn built
  # from source; Developer Preview bundle (no card step text, scanned after the build).
  # ios-build: Release build, Swift unit tests, bundle scan and link checks (path filter). When ios-e2e runs
  # in the same workflow run, it also builds the ad-hoc Simulator copy and hands both apps over as an artifact.
  ios-build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SKEPI_COREKIWIX_DIR: ${{ github.workspace }}/.cache/corekiwix
      SKEPI_PREVIEW: '1'
      # ccache for the C/C++/Objective-C builds (llama.cpp, SQLCipher, React Native modules) through Xcode's own
      # compiler launcher: with explicit modules (Xcode 26) React Native's CC wrapper (USE_CCACHE) is not used.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: 2G
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_FILECLONE: 'true'
      CCACHE_DEPEND: 'true'
      CCACHE_INODECACHE: 'true'
      DERIVED_DATA: ${{ github.workspace }}/apps/mobile/ios/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: ${{ !inputs.cold && 'pnpm' || '' }}
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          pod --version
          xcrun simctl list runtimes available
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.cold }}
        with:
          path: .cache/corekiwix
          key: corekiwix-${{ hashFiles('native/kiwix/corekiwix.lock.json') }}
      - name: CoreKiwix.xcframework (official Kiwix build, SHA-256 pinned)
        run: native/kiwix/fetch-corekiwix.sh --install-ios
      - name: ccache
        run: |
          brew install ccache
          ccache --version | head -n 1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.cold }}
        with:
          path: .ccache
          key: ccache-ios-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-ios-v2-${{ hashFiles('pnpm-lock.yaml') }}-
            ccache-ios-v2-
      - run: ccache --zero-stats
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.cold }}
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-v1-${{ hashFiles('pnpm-lock.yaml', 'modules/*/ios/*.podspec') }}
          restore-keys: cocoapods-v1-
      # Swift packages (MapLibre's binary distribution) and the clang module cache of DerivedData.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.cold }}
        with:
          path: |
            apps/mobile/ios/build/SourcePackages
            apps/mobile/ios/build/ModuleCache.noindex
          key: deriveddata-ios-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: deriveddata-ios-v1-
      - name: Expo prebuild (ios/ is generated, never committed)
        run: pnpm --filter @skepi/mobile exec expo prebuild --platform ios --clean --no-install
      - name: pod install
        working-directory: apps/mobile/ios
        run: pod install
      - name: Release build must fail with draft emergency cards
        run: |
          rc=0
          env -u SKEPI_PREVIEW CONFIGURATION=Release TARGET_BUILD_DIR="$RUNNER_TEMP/gate" UNLOCALIZED_RESOURCES_FOLDER_PATH=SKEPI.app \
            bash apps/mobile/plugins/ios/skepi-xcode.sh resources > gate.log 2>&1 || rc=$?
          cat gate.log
          if [ "$rc" -eq 0 ]; then echo "::error::the draft-cards gate let a release build through"; exit 1; fi
          grep -q "emergency cards are DRAFT" gate.log
      - name: xcodebuild Release for the Simulator (unsigned, Developer Preview)
        id: build
        run: |
          set -o pipefail
          # Report every compile error of a run, not only the first target's.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          echo "XCODE_CCACHE=C_COMPILER_LAUNCHER=$(command -v ccache) CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES" >> "$GITHUB_ENV"
          export XCODE_CCACHE="C_COMPILER_LAUNCHER=$(command -v ccache) CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES"
          xcodebuild -workspace apps/mobile/ios/SKEPI.xcworkspace -scheme SKEPI -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO $XCODE_CCACHE -quiet build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-release.log"
      - name: ccache statistics
        if: always()
        run: |
          ccache --show-stats --verbose
          ccache --evict-older-than 7d
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ always() && !inputs.cold }}
        with:
          path: .ccache
          key: ccache-ios-v2-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: App binary links no libcurl or libmicrohttpd (unused parts of CoreKiwix)
        run: |
          app="$DERIVED_DATA/Build/Products/Release-iphonesimulator/SKEPI.app"
          otool -L "$app/SKEPI"
          if nm -a "$app/SKEPI" | grep -E 'curl_easy_init|curl_multi_perform|MHD_start_daemon'; then echo "::error::network code from CoreKiwix is linked"; exit 1; fi
          echo "libzim symbols: $(nm -a "$app/SKEPI" | grep -c '3zim7Archive' || true)"
      - name: Preview bundle holds no card advice text
        run: node node_modules/tsx/dist/cli.mjs tools/release-guards/src/preview-cards-cli.ts "$DERIVED_DATA/Build/Products/Release-iphonesimulator/SKEPI.app/main.jsbundle"
      - name: Swift unit tests (SkepiZim; binding, catalog/hash, viewer sealing)
        run: |
          set -o pipefail
          # Compile first, then boot, then run: booting in parallel with the build or pnpm install saves nothing
          # on these runners (the first boot is CPU- and disk-bound) and slows them; a device the image already
          # has boots faster but takes as long to settle (measured in the follow-up runs, docs/phase-3b0-report.md).
          udid=$(e2e/ios/simulator.sh create skepi-tests)
          tests=(-workspace apps/mobile/ios/SKEPI.xcworkspace -scheme SkepiZim-Unit-Tests -destination "id=$udid" -derivedDataPath "$DERIVED_DATA")
          rc=0
          xcodebuild "${tests[@]}" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build-for-testing > "$RUNNER_TEMP/xcodebuild-tests.log" 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            start=$(date +%s); xcrun simctl bootstatus "$udid" -b > /dev/null; echo "Simulator booted in $(( $(date +%s) - start )) s"
            xcodebuild "${tests[@]}" -resultBundlePath "$RUNNER_TEMP/SkepiZimTests.xcresult" \
              CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO test-without-building >> "$RUNNER_TEMP/xcodebuild-tests.log" 2>&1 || rc=$?
          fi
          grep -E "Test (Case|Suite)|error:|Executed" "$RUNNER_TEMP/xcodebuild-tests.log" || tail -n 200 "$RUNNER_TEMP/xcodebuild-tests.log"
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/SkepiZimTests.xcresult" | tee "$RUNNER_TEMP/swift-tests-summary.json" || true
          xcrun simctl delete "$udid" || true
          exit "$rc"
      # For ios-e2e only. CI only: the copy Maestro installs is built with "Sign to Run Locally"
      # (CODE_SIGN_IDENTITY=-; no team, certificate, provisioning profile or secret; not installable on a
      # device), so the Simulator's Keychain accepts the app.db key. The checked Release build above stays
      # CODE_SIGNING_ALLOWED=NO and is handed over too, for the secure-storage failure flow.
      - name: Simulator copy for Maestro (ad-hoc "Sign to Run Locally", CI only)
        if: needs.changes.outputs.ios_e2e == 'true'
        run: |
          set -o pipefail
          products="$DERIVED_DATA/Build/Products/Release-iphonesimulator"
          apps="$RUNNER_TEMP/ios-sim-apps"
          rm -rf "$apps"
          mkdir -p "$apps/unsigned" "$apps/adhoc"
          cp -R "$products/SKEPI.app" "$apps/unsigned/"
          xcodebuild -workspace apps/mobile/ios/SKEPI.xcworkspace -scheme SKEPI -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$DERIVED_DATA" ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO $XCODE_CCACHE CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/e2e/ios/simulator-ci.entitlements" -quiet build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-adhoc.log"
          codesign -dv "$products/SKEPI.app" 2>&1 | grep -E "Signature|TeamIdentifier|Identifier"
          if codesign -dv "$products/SKEPI.app" 2>&1 | grep -q "TeamIdentifier=[A-Z0-9]\{10\}"; then echo "::error::the Simulator copy carries a team identity"; exit 1; fi
          cp -R "$products/SKEPI.app" "$apps/adhoc/"
          # tar keeps the executable bits, symlinks and code signatures (artifact zips do not).
          tar -C "$apps" -cf "$RUNNER_TEMP/ios-sim-apps.tar" unsigned adhoc
          ls -la "$RUNNER_TEMP/ios-sim-apps.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.ios_e2e == 'true'
        with:
          # A single file uploaded as-is (no zip); the artifact is named after it.
          path: ${{ runner.temp }}/ios-sim-apps.tar
          archive: false
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-build
          path: |
            ${{ runner.temp }}/swift-tests-summary.json
            ${{ runner.temp }}/xcodebuild-*.log
          if-no-files-found: ignore

  # iOS E2E on the Simulator with the apps ios-build made in this run (no rebuild): the secure-storage
  # failure flow (unsigned build), the Maestro flows (ad-hoc copy, provisioned packs, no AI) and the
  # retrieval parity run (108 en queries; no model) against the stored S23, desktop and rag-eval runs.
  ios-e2e:
    needs: [changes, ios-build]
    if: needs.changes.outputs.ios_e2e == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      SKEPI_CACHE_DIR: ${{ github.workspace }}/.cache/skepi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: ${{ !inputs.cold && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-sim-apps.tar
          path: ${{ runner.temp }}/sim-apps
      - name: Simulator apps from ios-build
        run: |
          ls -la "$RUNNER_TEMP/sim-apps"
          mkdir -p "$RUNNER_TEMP/apps"
          tar -C "$RUNNER_TEMP/apps" -xf "$RUNNER_TEMP/sim-apps/ios-sim-apps.tar"
          codesign -dv "$RUNNER_TEMP/apps/adhoc/SKEPI.app" 2>&1 | grep -E "Signature|TeamIdentifier|Identifier"
          if codesign -dv "$RUNNER_TEMP/apps/adhoc/SKEPI.app" 2>&1 | grep -q "TeamIdentifier=[A-Z0-9]\{10\}"; then echo "::error::the Simulator copy carries a team identity"; exit 1; fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.cold }}
        with:
          path: .cache/skepi
          key: ios-e2e-packs-${{ hashFiles('catalog/embedded/release/catalog.json') }}
      - name: Maestro (pinned, SHA-256 checked)
        env:
          MAESTRO_URL: https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl --fail --location --retry 5 --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "$MAESTRO_URL"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-dist"
          echo "MAESTRO=$HOME/.maestro-dist/maestro/bin/maestro" >> "$GITHUB_ENV"
      - name: Maestro flows and retrieval parity on the Simulator (provisioned packs, no AI on the Simulator)
        run: |
          e2e/ios/run-ios-e2e.sh "$RUNNER_TEMP/apps/adhoc/SKEPI.app" "$RUNNER_TEMP/apps/unsigned/SKEPI.app"
      - name: Retrieval parity report
        if: always()
        run: cat e2e/out/ios/parity/parity-reference.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no parity report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-e2e
          path: e2e/out/ios/
          if-no-files-found: ignore

  # Phase 3b-0: the desktop app on macOS (Apple silicon). libzim 9.7.0 is the macOS slice of the same
  # pinned CoreKiwix.xcframework (static); llama.cpp with Metal (Vulkan stays on Windows); unsigned bundle.
  desktop-macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      SKEPI_COREKIWIX_DIR: ${{ github.workspace }}/.cache/corekiwix
      SKEPI_CACHE_DIR: ${{ github.workspace }}/.cache/skepi
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      FEATURES: desktop-core/metal,skepi-desktop/metal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.98.1 --profile minimal -c rustfmt -c clippy
          rustup default 1.98.1
          sw_vers
          xcodebuild -version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # v2: the v1 cache was saved by a run that stopped at clippy, and a full key hit is never re-saved.
          key: llama-cpp-sys-2-0.1.159-metal-v2-${{ hashFiles('native/kiwix/corekiwix.lock.json') }}
          cache-on-failure: 'true'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/corekiwix
          key: corekiwix-${{ hashFiles('native/kiwix/corekiwix.lock.json') }}
      - name: CoreKiwix.xcframework (official Kiwix build, SHA-256 pinned; macOS slice)
        run: native/kiwix/fetch-corekiwix.sh
      - run: cargo fmt --all -- --check
      - name: Clippy (Metal build)
        run: cargo clippy --workspace --all-targets --no-default-features --features "$FEATURES" -- -D warnings
      - name: Tests (Metal build)
        run: cargo test --workspace --no-default-features --features "$FEATURES"
      - name: Desktop UI (Developer Preview) holds no card advice text
        run: |
          SKEPI_PREVIEW=1 pnpm --filter @skepi/desktop build
          node node_modules/tsx/dist/cli.mjs tools/release-guards/src/preview-cards-cli.ts apps/desktop/dist
      - name: Unsigned Tauri build (aarch64-apple-darwin, app + dmg, Developer Preview)
        env:
          SKEPI_PREVIEW: '1'
        run: pnpm --filter @skepi/desktop exec tauri build --target aarch64-apple-darwin --bundles app,dmg --no-sign --features metal -- --no-default-features
      - name: Binary links only system libraries; no libcurl or libmicrohttpd
        run: |
          bin="target/aarch64-apple-darwin/release/skepi-desktop"
          otool -L "$bin"
          if otool -L "$bin" | tail -n +2 | grep -v -E '^[[:space:]]+(/usr/lib/|/System/Library/)'; then echo "::error::non-system library linked"; exit 1; fi
          if nm -a "$bin" | grep -E 'curl_easy_init|curl_multi_perform|MHD_start_daemon'; then echo "::error::network code from CoreKiwix is linked"; exit 1; fi
          ls -la target/aarch64-apple-darwin/release/bundle/macos target/aarch64-apple-darwin/release/bundle/dmg
      - name: Egress (idle; the app process and its WebKit processes)
        run: node apps/desktop/e2e/egress-macos.mjs --app target/aarch64-apple-darwin/release/bundle/macos/SKEPI.app --out e2e/out/egress-macos --idle 90 --expect-none
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-macos
          path: |
            e2e/out/egress-macos/egress.*
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: ignore
