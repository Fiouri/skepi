# Android reproducible build (F-Droid "reproducible, our signature"; docs/release-process.md).
# Two clean unsigned release builds of the same commit on two runners, in different checkout paths and
# with different Gradle user homes, no Gradle build cache and no ccache. android-repro passes only when
# both APKs are byte-identical; it then uploads the unsigned APK and its SHA-256. That artifact is what
# the maintainer signs locally with the release key (never in CI) and publishes.
# Developer Preview mode (SKEPI_PREVIEW=1, -PskepiPreview=true) with the JDK 21 toolchain and Node 24
# (scripts/android/jdk21.sh, -PskepiJdk21=true), as the F-Droid recipe builds it on Debian trixie.
# fdroid-build runs `fdroid build` of docs/fdroid/org.skepi.app.yml in F-Droid's buildserver container and
# must produce the same bytes as android-repro (scripts/ci/fdroid-build.sh).
# Actions are pinned to commit SHAs (supply chain, docs/architecture.md).
name: Android reproducible build

on:
  push:
    branches: [main]
    # Everything that can change the APK, plus the F-Droid recipe (later patterns win).
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/fdroid/**'
      - '!fastlane/**'
      - '!crates/**'
      - '!apps/desktop/**'
      - '!e2e/**'
      - '!native/vulkan/**'
      - '!Cargo.toml'
      - '!Cargo.lock'
      - '!rustfmt.toml'
      - '!.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-repro-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # fdroid-build is slow (~1 h): it runs on demand and when the recipe or the Android build inputs change.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fdroid: ${{ steps.diff.outputs.fdroid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "fdroid=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          FDROID_PATHS='^(docs/fdroid/|apps/mobile/(android/|plugins/|package\.json$|app\.json$|metro\.config\.js$)|modules/[^/]+/(android/|package\.json$|expo-module\.config\.json$)|scripts/(android|ci)/|pnpm-lock\.yaml$|package\.json$|pnpm-workspace\.yaml$|\.github/workflows/android-repro\.yml$)'
          n=$(git diff --name-only "$BASE...$GITHUB_SHA" | grep -c -E "$FDROID_PATHS" || true)
          echo "fdroid=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  android-repro-build:
    name: android-repro-build (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Different depth and length of the checkout path, different Gradle user home.
          - leg: a
            dir: a
            gradle_home: /home/runner/.gradle
          - leg: b
            dir: build-bb/second-checkout
            gradle_home: /home/runner/gradle-home-bb
    env:
      GRADLE_USER_HOME: ${{ matrix.gradle_home }}
      SKEPI_PREVIEW: '1'
      # At most two native links at once (scripts/ci/link-slot.sh): llama.rn's variant libraries link
      # together and each ld.lld run needs ~2.4 GB. The launcher does not change the output.
      CMAKE_C_LINKER_LAUNCHER: ${{ github.workspace }}/${{ matrix.dir }}/scripts/ci/link-slot.sh
      CMAKE_CXX_LINKER_LAUNCHER: ${{ github.workspace }}/${{ matrix.dir }}/scripts/ci/link-slot.sh
      SKEPI_LINK_SLOTS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.dir }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.dir }}/package.json
      # Node and JDK as on F-Droid's Debian buildserver (nodejs from forky, OpenJDK 21 from trixie).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Swap (10 GB)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/skepi.swap
          sudo chmod 600 /mnt/skepi.swap
          sudo mkswap /mnt/skepi.swap > /dev/null
          sudo swapon /mnt/skepi.swap
          free -m
      - name: Install (frozen lockfile)
        working-directory: ${{ matrix.dir }}
        run: pnpm install --frozen-lockfile
      - name: JDK 21 toolchain (scripts/android/jdk21.sh, as in the F-Droid recipe)
        working-directory: ${{ matrix.dir }}
        run: bash scripts/android/jdk21.sh
      - name: Expo prebuild (android/ is generated, never committed)
        working-directory: ${{ matrix.dir }}
        run: pnpm --filter @skepi/mobile run prebuild
      - name: Unsigned release APK (clean, no build cache)
        working-directory: ${{ matrix.dir }}/apps/mobile/android
        run: |
          echo "checkout: $PWD"
          echo "Gradle user home: $GRADLE_USER_HOME"
          ./gradlew assembleRelease -PskepiUnsigned=true -PskepiPreview=true -PskepiJdk21=true -Porg.gradle.java.installations.auto-download=false --no-build-cache --no-configuration-cache --console=plain
      - name: APK is unsigned
        working-directory: ${{ matrix.dir }}
        run: python3 scripts/ci/apk-compare.py unsigned apps/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
      - name: Native libraries carry no build-id and no checkout or Gradle paths
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          readelf=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf | head -n 1)
          rm -rf "$RUNNER_TEMP/libs" && mkdir -p "$RUNNER_TEMP/libs"
          unzip -q -o "$apk" 'lib/*' -d "$RUNNER_TEMP/libs"
          bad=0
          for so in "$RUNNER_TEMP"/libs/lib/arm64-v8a/*.so; do
            if grep -a -q -F -e "$GITHUB_WORKSPACE" -e "$GRADLE_USER_HOME" "$so"; then
              echo "::warning::$(basename "$so") contains a checkout or Gradle home path"; bad=1
            fi
            if "$readelf" -n "$so" | grep -q 'GNU_BUILD_ID'; then echo "$(basename "$so"): build-id"; fi
          done
          echo "path check: $([ $bad -eq 0 ] && echo clean || echo 'paths found (prebuilt Maven libraries are checked by the comparison only)')"
      - name: SHA-256
        working-directory: ${{ matrix.dir }}/apps/mobile/android/app/build/outputs/apk/release
        run: sha256sum app-arm64-v8a-release-unsigned.apk | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-${{ matrix.leg }}
          path: ${{ matrix.dir }}/apps/mobile/android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error

  android-repro:
    needs: android-repro-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/ci
            apps/mobile/app.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-a
          path: a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-b
          path: b
      - name: Both builds are byte-identical
        id: compare
        run: python3 scripts/ci/apk-compare.py same a/app-arm64-v8a-release-unsigned.apk b/app-arm64-v8a-release-unsigned.apk
      - name: Differences (diffoscope on the differing entries)
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q diffoscope-minimal llvm binutils-aarch64-linux-gnu > /dev/null
          mkdir -p ua ub
          unzip -q a/app-arm64-v8a-release-unsigned.apk -d ua
          unzip -q b/app-arm64-v8a-release-unsigned.apk -d ub
          diffoscope --max-text-report-size 400000 --text diffoscope.txt ua ub || true
          head -c 200000 diffoscope.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.compare.outcome == 'failure'
        with:
          name: repro-diffoscope
          path: diffoscope.txt
          retention-days: 7
      - name: Name the artifact and write SHA256SUMS
        id: name
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['version'])")
          code=$(python3 -c "import json;print(json.load(open('apps/mobile/app.json'))['expo']['android']['versionCode'])")
          name="skepi-${version}-arm64-unsigned.apk"
          mkdir -p out
          cp a/app-arm64-v8a-release-unsigned.apk "out/$name"
          (cd out && sha256sum "$name" > SHA256SUMS.txt)
          echo "artifact=skepi-${version}-vc${code}-${GITHUB_SHA::12}-unsigned" >> "$GITHUB_OUTPUT"
          {
            echo "### Reproducible unsigned APK"
            echo
            echo "Commit \`$GITHUB_SHA\`, version \`$version\` (versionCode $code), run \`$GITHUB_RUN_ID\`."
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
            echo
            echo "Two clean builds (different runners, checkout paths and Gradle homes) are byte-identical."
          } >> "$GITHUB_STEP_SUMMARY"
          cat out/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: out/
          retention-days: 90
          if-no-files-found: error

  # `fdroid build` of the recipe at this commit in F-Droid's buildserver container (Debian trixie, OpenJDK
  # 21, fdroidserver pinned like fdroiddata's CI). Passes only when its unsigned APK is byte-identical to
  # android-repro's.
  fdroid-build:
    needs: changes
    if: needs.changes.outputs.fdroid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - name: Disk space (the container, two NDKs and the build need ~40 GB)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h / /mnt
      - name: fdroid build in registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/fdroid/build /mnt/fdroid/gradle /mnt/fdroid/out
          sudo docker run --rm \
            -v "$GITHUB_WORKSPACE/src:/src:ro" \
            -v /mnt/fdroid/build:/home/vagrant/build \
            -v /mnt/fdroid/gradle:/home/vagrant/.gradle \
            -v /mnt/fdroid/out:/out \
            -e APP_COMMIT="$GITHUB_SHA" \
            -e REPO_URL="https://github.com/$GITHUB_REPOSITORY.git" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /src/scripts/ci/fdroid-build.sh
      - name: Collect the output
        if: always()
        run: |
          sudo chown -R "$(id -u)" /mnt/fdroid/out || true
          mkdir -p fdroid-out && cp -r /mnt/fdroid/out/. fdroid-out/ || true
          ls -la fdroid-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fdroid-build
          path: fdroid-out/
          retention-days: 14
          if-no-files-found: warn
      # android-repro-build runs in parallel; wait for its artifact (same run).
      - name: Wait for the android-repro artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="repro-a")] | length')
            [ "$n" -gt 0 ] && exit 0
            sleep 30
          done
          echo "::error::repro-a did not appear within 60 minutes"; exit 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repro-a
          path: repro
      - name: fdroid build and android-repro are byte-identical
        id: compare
        run: |
          apk=$(ls fdroid-out/org.skepi.app_*.apk)
          python3 src/scripts/ci/apk-compare.py same "$apk" repro/app-arm64-v8a-release-unsigned.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Differences (diffoscope)
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q diffoscope-minimal llvm binutils-aarch64-linux-gnu default-jdk-headless > /dev/null
          mkdir -p uf ur
          unzip -q fdroid-out/org.skepi.app_*.apk -d uf
          unzip -q repro/app-arm64-v8a-release-unsigned.apk -d ur
          diffoscope --exclude-directory-metadata=yes --max-text-report-size 400000 --text diffoscope-fdroid.txt uf ur || true
          head -c 150000 diffoscope-fdroid.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.compare.outcome == 'failure'
        with:
          name: fdroid-diffoscope
          path: diffoscope-fdroid.txt
          retention-days: 14
