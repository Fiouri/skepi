[package]
name = "desktop-core"
version = "0.1.0"
description = "SKEPI desktop engines: ZIM text, inference, content store, catalog, database, Station mode"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["vulkan"]
# llama.cpp GPU offload on Windows (needs the Vulkan SDK at build time; CPU fallback at run time).
vulkan = ["llama-cpp-2/vulkan"]
# Debug builds only: trusts the local HTTPS test mirror CA for 127.0.0.1 (e2e/mirror/certs).
test-mirror = []

[dependencies]
zim-ffi = { path = "../zim-ffi" }
base64 = "=0.23.1"
ed25519-dalek = "=3.0.0"
llama-cpp-2 = { version = "=0.1.159", default-features = false, features = ["openmp", "common"] }
rcgen = "=0.14.10"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
ego-tree = "=0.11.0"
scraper = "=0.27.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
thiserror = "=2.0.21"
time = "=0.3.55"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
futures-util = "=0.3.34"
getrandom = "=0.4.3"
percent-encoding = "=2.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
