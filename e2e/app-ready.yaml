# Subflow after launchApp: wait for the home screen or onboarding, and skip onboarding if shown.
appId: ${APP_ID}
name: App ready
---
- extendedWaitUntil:
    visible:
      id: "(tab-search|onboarding)"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: onboarding
    file: skip-onboarding.yaml
# Flows start in normal mode (blackout mode persists in app.db; blackout.yaml switches it on and off).
- runFlow:
    when:
      visible:
        id: blackout-on
    commands:
      - tapOn:
          id: blackout-toggle
