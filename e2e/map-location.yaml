# Live position on the map (decision 2026-10-21), airplane mode, debug build with its debug-only mock GNSS
# provider (run-e2e.ps1 -MockLocation pushes the fixed fix: Patras, ±5 m, and grants "while in use"
# location). The fix arrives once the map tab is in front: puck legend, coordinates panel, then the
# "My location" button: first press centres, second press follows, panning the map leaves follow mode.
# The map pack (map-gr) must be installed in the debug app (scripts/provision.ps1 -AppId org.skepi.app.dev).
appId: ${APP_ID}
name: SKEPI map location (offline, mock GNSS)
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- tapOn:
    id: tab-map
- extendedWaitUntil:
    visible:
      id: map-status
      text: "Map ready.*"
    timeout: 60000
# The first fix: puck (live, blue) with its accuracy, and the coordinates.
- extendedWaitUntil:
    visible:
      id: map-puck
    timeout: 30000
- assertVisible: "You are here \\(±5 m\\)"
- assertVisible:
    id: map-coordinates-decimal
    text: "38\\.24664, 21\\.73457"
- assertVisible:
    id: map-heading
- assertNotVisible:
    id: map-waiting-gps
# First press: centre on the position.
- tapOn:
    id: map-my-location
- assertVisible: "My location"
- takeScreenshot: e2e/out/map-location-01-puck
# Second press: follow mode.
- tapOn:
    id: map-my-location
- extendedWaitUntil:
    visible: "Following you"
    timeout: 5000
- takeScreenshot: e2e/out/map-location-02-follow
# Panning the map leaves follow mode.
- swipe:
    start: 50%, 30%
    end: 15%, 30%
    duration: 400
- extendedWaitUntil:
    visible: "My location"
    timeout: 5000
- assertVisible:
    id: map-puck
- takeScreenshot: e2e/out/map-location-03-panned
