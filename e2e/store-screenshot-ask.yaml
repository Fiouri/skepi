# Store screenshot of Ask on a phone with the model (the S23: Layer 1 source excerpts, then the automatic
# AI summary with its label and citation chips), release build, airplane mode, a non-medical question with
# sources. Run: e2e/run-screenshots.ps1 -Serial <phone> -Height <phone height> -Flow
# e2e/store-screenshot-ask.yaml -Names 4_ask_sources. Replaces the emulator's Ask screenshot (no model).
appId: ${APP_ID}
name: SKEPI store screenshot (Ask with AI summary)
env:
  ASK_QUESTION: How does a water filter work?
  OUT: store
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: layer1-passage-0
    timeout: 30000
# No emergency banner or card for this question (the screenshot shows sources and the AI summary only).
- assertNotVisible:
    id: emergency-banner
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 240000
- assertVisible: "Source excerpts — not verified advice"
# Stop as soon as the first AI sentence is fully on screen: the last source excerpt stays visible above
# the labelled AI summary (scrolling further brings up the debug lines below it).
- scrollUntilVisible:
    element:
      id: answer-sentence-0
    direction: DOWN
    visibilityPercentage: 100
    timeout: 20000
- assertVisible: "AI summary — check the source"
- assertVisible: "\\[S[0-9]+\\].*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/4_ask_sources
