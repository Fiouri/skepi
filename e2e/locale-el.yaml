# Greek UI flow: run-e2e.ps1 sets the app locale to el-GR (per-app language, Android 13+) before
# this flow and resets it afterwards. Greek UI strings, then a Greek question answered by Layer 1
# from the Greek pack.
appId: ${APP_ID}
name: SKEPI Greek UI (offline)
env:
  ASK_QUESTION: Πού βρίσκεται η Πάτρα;
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 30000
- assertVisible: "Αναζήτηση"
- assertVisible: "Ρώτα"
- assertVisible: "Χάρτης"
- assertVisible: "Πλήρες κείμενο"
- assertNotVisible: "Full-text"
- takeScreenshot: e2e/out/el-01-greek-ui
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: layer1-passage-0
    timeout: 15000
- assertVisible: "Από τις πηγές"
- takeScreenshot: e2e/out/el-02-layer1
# Greek tools tab and emergency card
- tapOn:
    id: tab-tools
- extendedWaitUntil:
    visible: "Φως SOS"
    timeout: 10000
- assertVisible: "Η θέση μου"
- takeScreenshot: e2e/out/el-03-tools
- tapOn:
    id: tab-search
- tapOn:
    id: home-emergency
- extendedWaitUntil:
    visible: "Κλήση 112"
    timeout: 10000
- assertVisible: "ΕΚΑΒ / ασθενοφόρο: 166"
- scrollUntilVisible:
    element:
      id: card-link-cpr
    direction: DOWN
    timeout: 20000
- tapOn:
    id: card-link-cpr
- extendedWaitUntil:
    visible:
      id: card-draft-banner
    timeout: 10000
- assertVisible: "Πρόχειρο — δεν έχει ελεγχθεί από επαγγελματίες πρώτων βοηθειών"
- assertVisible: "ΚΑΡΠΑ: δεν αντιδρά και δεν αναπνέει \(ενήλικας\)"
- takeScreenshot: e2e/out/el-04-card
- back
- back
