# iOS Simulator: suggestions while typing, full-text on submit, the first result in the sealed zim://
# viewer (WKWebView + content rule list), zero blocked requests.
appId: org.skepi.app
name: SKEPI iOS search and article
env:
  SEARCH_QUERY: Water purification
---
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 60000
# Simulator typing can drop characters under load ("Wurification", run 38229617151): type, search and
# check for at least one result; on a miss erase and type again once.
- retry:
    maxRetries: 1
    commands:
      - tapOn:
          id: search-input
      - eraseText: 80
      - inputText: ${SEARCH_QUERY}
      - extendedWaitUntil:
          visible:
            id: search-timing
          timeout: 20000
      - tapOn:
          id: search-fulltext
      - extendedWaitUntil:
          visible:
            text: "fulltext: [1-9].*"
          timeout: 20000
- takeScreenshot: e2e/out/ios/01-search
- scrollUntilVisible:
    element:
      id: search-result-0
    direction: DOWN
    timeout: 20000
- tapOn:
    id: search-result-0
- extendedWaitUntil:
    visible:
      text: "Opened in .*"
    timeout: 30000
- assertVisible:
    id: article-view
- assertVisible: "Blocked requests: 0"
- takeScreenshot: e2e/out/ios/02-article
