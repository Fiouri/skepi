# iOS Simulator, Developer Preview bundle: the CPR card says "Under professional review" and shows no
# step (the built bundle holds no card advice text: also checked at build time).
appId: org.skepi.app
name: SKEPI iOS emergency cards (preview)
---
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- tapOn:
    id: home-emergency
- extendedWaitUntil:
    visible:
      id: emergency-numbers
    timeout: 10000
- assertVisible: "Call 112"
- scrollUntilVisible:
    element:
      id: card-link-cpr
    direction: DOWN
    timeout: 20000
- tapOn:
    id: card-link-cpr
- extendedWaitUntil:
    visible:
      id: card-under-review
    timeout: 10000
- assertVisible: "Under professional review"
- assertNotVisible:
    id: card-step-1
- assertNotVisible:
    id: card-read-aloud
- takeScreenshot: e2e/out/ios/08-card-preview
