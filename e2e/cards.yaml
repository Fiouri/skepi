# Emergency card flow (release build, airplane mode, English UI, country Greece):
# home Emergency button -> numbers -> a card: "Call 112 first", the verbatim IFRC steps, the citation
# (edition, section, pages) and read-aloud; unsourced topics (earthquake, fire, flood, water) have no card.
# An emergency question in Ask shows the number and the card before anything else; home search finds cards.
appId: ${APP_ID}
name: SKEPI emergency cards (offline)
env:
  ASK_QUESTION: Someone collapsed and is not breathing. How do I do CPR?
  QUAKE_QUESTION: What should I do in an earthquake?
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- tapOn:
    id: home-emergency
- extendedWaitUntil:
    visible:
      id: emergency-numbers
    timeout: 10000
- assertVisible: "Call 112"
- assertVisible: "Ambulance: 166"
- assertVisible: "Fire service: 199"
- assertVisible: "Police: 100"
- takeScreenshot: e2e/out/cards-01-numbers
- scrollUntilVisible:
    element:
      id: card-link-cpr
    direction: DOWN
    timeout: 20000
- tapOn:
    id: card-link-cpr
- extendedWaitUntil:
    visible:
      id: card-call-first
    timeout: 10000
- assertVisible: "Call 112 first"
- assertVisible:
    id: card-step-1
    text: ".*Check for a response by gently shaking the person.*"
- takeScreenshot: e2e/out/cards-02-cpr
- tapOn:
    id: card-read-aloud
- extendedWaitUntil:
    visible: "Stop reading"
    timeout: 10000
- tapOn:
    id: card-read-aloud
- scrollUntilVisible:
    element:
      id: card-citation
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: card-citation
    text: "Source: IFRC International First Aid, Resuscitation and Education Guidelines 2025, .*pp\\. 161–162\\."
- takeScreenshot: e2e/out/cards-02b-cpr-citation
- back
# No card for a topic without an IFRC passage
- scrollUntilVisible:
    element:
      id: card-link-poisoning
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: card-link-earthquake
- assertNotVisible:
    id: card-link-flood
- back
# Ask: number and card first
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: emergency-banner
    timeout: 15000
- assertVisible: "Emergency\\? Call 112"
- assertVisible:
    id: inline-card-cpr
- assertVisible:
    id: inline-card-cpr
    below:
      id: emergency-banner
- takeScreenshot: e2e/out/cards-03-ask-card-first
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 30000
- tapOn:
    id: ask-clear
# An emergency question that the packs answer: the country's number comes before the first Layer 1
# excerpt (architecture: "User safety").
- tapOn:
    id: ask-input
- inputText: ${QUAKE_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: layer1
    timeout: 30000
- assertVisible:
    id: emergency-banner
- assertVisible:
    id: layer1
    below:
      id: emergency-banner
- takeScreenshot: e2e/out/cards-05-number-before-layer1
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 120000
# Emergency intent: no AI summary at all, not even on tap
- scrollUntilVisible:
    element:
      id: summary-emergency
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: ask-summarise
- assertNotVisible:
    id: ai-summary
- takeScreenshot: e2e/out/cards-06-no-ai-summary
- tapOn:
    id: ask-clear
# Home search finds cards with no pack involved
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: burn
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: card-link-burns
    timeout: 10000
- takeScreenshot: e2e/out/cards-04-search
