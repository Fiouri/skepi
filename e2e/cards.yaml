# Emergency card flow (release build, airplane mode, English UI, country Greece):
# home Emergency button -> numbers -> a card: "Call 112 first", the verbatim IFRC steps, the citation
# (edition, section, pages) and read-aloud; the earthquake (FEMA Ready.gov) and water (CDC) cards: verbatim
# steps, citation (title, URL, retrieval date) and the no-endorsement statement.
# An emergency question in Ask shows the number and the card before anything else; home search finds cards.
appId: ${APP_ID}
name: SKEPI emergency cards (offline)
env:
  ASK_QUESTION: Someone collapsed and is not breathing. How do I do CPR?
  QUAKE_QUESTION: What should I do in an earthquake?
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- tapOn:
    id: home-emergency
- extendedWaitUntil:
    visible:
      id: emergency-numbers
    timeout: 10000
- assertVisible: "Call 112"
- assertVisible: "Ambulance: 166"
- assertVisible: "Fire service: 199"
- assertVisible: "Police: 100"
- takeScreenshot: e2e/out/cards-01-numbers
- scrollUntilVisible:
    element:
      id: card-link-cpr
    direction: DOWN
    timeout: 20000
- tapOn:
    id: card-link-cpr
- extendedWaitUntil:
    visible:
      id: card-call-first
    timeout: 10000
- assertVisible: "Call 112 first"
- assertVisible:
    id: card-step-1
    text: ".*Check for a response by gently shaking the person.*"
- takeScreenshot: e2e/out/cards-02-cpr
- tapOn:
    id: card-read-aloud
- extendedWaitUntil:
    visible: "Stop reading"
    timeout: 10000
- tapOn:
    id: card-read-aloud
- scrollUntilVisible:
    element:
      id: card-citation
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: card-citation
    text: "Source: IFRC International First Aid, Resuscitation and Education Guidelines 2025, .*pp\\. 161–162\\."
- takeScreenshot: e2e/out/cards-02b-cpr-citation
- back
# Public-domain cards: Ready.gov (earthquake) and CDC (water), cited with the endorsement disclaimer
- scrollUntilVisible:
    element:
      id: card-link-earthquake
    direction: DOWN
    timeout: 20000
- tapOn:
    id: card-link-earthquake
- extendedWaitUntil:
    visible:
      id: card-call-first
    timeout: 10000
- assertVisible: "Call 112 first"
- assertVisible:
    id: card-step-1
    text: ".*If an earthquake happens, protect yourself right away\\."
- scrollUntilVisible:
    element:
      id: card-disclaimer
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: card-citation
    text: "Source: FEMA, Ready\\.gov\\. “Earthquakes”, https://www\\.ready\\.gov/earthquakes, retrieved 2026-10-21\\."
- assertVisible:
    id: card-disclaimer
    text: ".*does not imply that the Federal Emergency Management Agency or the U\\.S\\. Government endorses S\\.K\\.E\\.P\\.I\\..*"
- takeScreenshot: e2e/out/cards-02c-earthquake-citation
- back
- scrollUntilVisible:
    element:
      id: card-link-water-purification
    direction: DOWN
    timeout: 20000
- tapOn:
    id: card-link-water-purification
- extendedWaitUntil:
    visible:
      id: card-step-1
      text: ".*Use bottled, boiled, or treated water to avoid getting sick\\."
    timeout: 10000
- scrollUntilVisible:
    element:
      id: card-disclaimer
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: card-citation
    text: "Source: CDC\\. “How to Make Water Safe in an Emergency”, https://www\\.cdc\\.gov/water-emergency/about/index\\.html, retrieved 2026-10-21\\."
- assertVisible:
    id: card-disclaimer
    text: ".*does not imply endorsement by CDC, HHS or the United States Government.*available on the CDC website for no charge\\."
- takeScreenshot: e2e/out/cards-02d-water-citation
- back
- back
# Ask: number and card first
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: emergency-banner
    timeout: 15000
- assertVisible: "Emergency\\? Call 112"
- assertVisible:
    id: inline-card-cpr
- assertVisible:
    id: inline-card-cpr
    below:
      id: emergency-banner
- takeScreenshot: e2e/out/cards-03-ask-card-first
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 30000
- tapOn:
    id: ask-clear
# An emergency question that the packs answer: the country's number comes before the first Layer 1
# excerpt (architecture: "User safety").
- tapOn:
    id: ask-input
- inputText: ${QUAKE_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
# The number, then the earthquake card (Ready.gov), then Layer 1 further down (the card is long).
- extendedWaitUntil:
    visible:
      id: inline-card-earthquake
    timeout: 30000
- assertVisible:
    id: emergency-banner
- assertVisible:
    id: inline-card-earthquake
    below:
      id: emergency-banner
- takeScreenshot: e2e/out/cards-05-number-and-card-first
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: layer1
    direction: DOWN
    timeout: 30000
- takeScreenshot: e2e/out/cards-05b-layer1-after-the-card
# Emergency intent: no AI summary at all, not even on tap
- scrollUntilVisible:
    element:
      id: summary-emergency
    direction: DOWN
    timeout: 20000
- assertNotVisible:
    id: ask-summarise
- assertNotVisible:
    id: ai-summary
- takeScreenshot: e2e/out/cards-06-no-ai-summary
- tapOn:
    id: ask-clear
# Home search finds cards with no pack involved
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: burn
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: card-link-burns
    timeout: 10000
- takeScreenshot: e2e/out/cards-04-search
