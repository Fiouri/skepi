# Emergency card flow (release build, airplane mode, English UI, country Greece):
# home Emergency button -> numbers -> a card: in a Developer Preview build (SKEPI_PREVIEW=1) "Under
# professional review" and no steps; otherwise its permanent draft banner, steps and read-aloud.
# An emergency question in Ask shows the number and the card before anything else; home search finds cards.
appId: ${APP_ID}
name: SKEPI emergency cards (offline)
env:
  ASK_QUESTION: Someone collapsed and is not breathing. How do I do CPR?
  QUAKE_QUESTION: What should I do in an earthquake?
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- tapOn:
    id: home-emergency
- extendedWaitUntil:
    visible:
      id: emergency-numbers
    timeout: 10000
- assertVisible: "Call 112"
- assertVisible: "Ambulance: 166"
- assertVisible: "Fire service: 199"
- assertVisible: "Police: 100"
- takeScreenshot: e2e/out/cards-01-numbers
- scrollUntilVisible:
    element:
      id: card-link-cpr
    direction: DOWN
    timeout: 20000
- tapOn:
    id: card-link-cpr
- extendedWaitUntil:
    visible:
      id: "card-(draft-banner|under-review)"
    timeout: 10000
- assertVisible: "Call 112"
- runFlow:
    when:
      visible:
        id: card-under-review
    commands:
      - assertVisible: "Under professional review"
      - assertNotVisible:
          id: card-step-1
      - assertNotVisible:
          id: card-read-aloud
      - takeScreenshot: e2e/out/cards-02-cpr
- runFlow:
    when:
      visible:
        id: card-draft-banner
    commands:
      - assertVisible: "Draft — not reviewed by first-aid professionals"
      - assertVisible:
          id: card-step-1
      - tapOn:
          id: card-read-aloud
      - extendedWaitUntil:
          visible: "Stop reading"
          timeout: 10000
      - takeScreenshot: e2e/out/cards-02-cpr
      - tapOn:
          id: card-read-aloud
- back
- back
# Ask: number and card first
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: emergency-banner
    timeout: 15000
- assertVisible: "Emergency\\? Call 112"
- assertVisible:
    id: inline-card-cpr
- assertVisible: "(Draft — not reviewed by first-aid professionals|Under professional review)"
- assertVisible:
    id: inline-card-cpr
    below:
      id: emergency-banner
- takeScreenshot: e2e/out/cards-03-ask-card-first
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 30000
- tapOn:
    id: ask-clear
# An emergency question that the packs answer: the country's number comes before the first Layer 1
# excerpt (architecture: "User safety").
- tapOn:
    id: ask-input
- inputText: ${QUAKE_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: layer1
    timeout: 30000
- assertVisible:
    id: emergency-banner
- assertVisible:
    id: layer1
    below:
      id: emergency-banner
- takeScreenshot: e2e/out/cards-05-number-before-layer1
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 120000
- tapOn:
    id: ask-clear
# Home search finds cards with no pack involved
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: burn
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: card-link-burns
    timeout: 10000
- takeScreenshot: e2e/out/cards-04-search
