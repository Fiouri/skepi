# English flow (Android, release build, airplane mode, English UI, English content):
# search -> article -> Ask: Layer 1 first, then the automatic AI summary (T2) with its label and a
# citation chip -> cited article -> unrelated question (no source, no AI) -> offline map.
# Run: e2e/run-e2e.ps1 (sets the app locale, collects logcat + blocked-request log).
appId: ${APP_ID}
name: SKEPI English flow (offline)
env:
  SEARCH_QUERY: Water purification
  ASK_QUESTION: What is the capital of Australia?
  UNRELATED_QUESTION: What is my grandmother's recipe for truffle souffle?
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml

# 1. Search: suggestions while typing, full-text on submit
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 30000
- assertVisible: "Search"
- assertVisible: "Ask"
- assertVisible: "Map"
- tapOn:
    id: search-input
- inputText: ${SEARCH_QUERY}
- extendedWaitUntil:
    visible:
      id: search-timing
    timeout: 10000
- tapOn:
    id: search-fulltext
- extendedWaitUntil:
    visible:
      text: "fulltext:.*"
    timeout: 10000
- takeScreenshot: e2e/out/01-search

# 2. Open the first result in the sealed zim:// viewer
- tapOn:
    id: search-result-0
- extendedWaitUntil:
    visible:
      text: "Opened in .*"
    timeout: 15000
- assertVisible:
    id: article-view
- assertVisible: "Blocked requests: 0"
- takeScreenshot: e2e/out/02-article
- back

# 3. Ask: Layer 1 passages appear, then the labelled AI summary with a citation
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: layer1-passage-0
    timeout: 15000
- assertVisible: "From the sources"
- takeScreenshot: e2e/out/03-layer1
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 180000
- scrollUntilVisible:
    element:
      id: answer-sentence-0
    direction: DOWN
    timeout: 20000
- assertVisible: "AI summary — check the source"
- assertVisible:
    id: "citation-S[0-9]+"
- assertNotVisible:
    id: summary-hidden
- takeScreenshot: e2e/out/04-ai-summary

# 4. Citation chip opens the cited article
- tapOn:
    id: "citation-S[0-9]+"
- extendedWaitUntil:
    visible:
      text: "Opened in .*"
    timeout: 15000
- assertVisible: "Blocked requests: 0"
- takeScreenshot: e2e/out/05-cited-article
- back

# 5. Unrelated question: "no source found", no Layer 1, no AI
- scrollUntilVisible:
    element:
      id: ask-clear
    direction: UP
    timeout: 20000
- tapOn:
    id: ask-clear
- tapOn:
    id: ask-input
- inputText: ${UNRELATED_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: no-source
    timeout: 60000
- assertNotVisible:
    id: ai-summary
- assertNotVisible:
    id: layer1
- assertVisible: "Reason: .*no generation"
- takeScreenshot: e2e/out/06-no-source

# 6. Offline map (PMTiles from local file)
- tapOn:
    id: tab-map
- extendedWaitUntil:
    visible:
      text: "Map ready.*"
    timeout: 60000
- takeScreenshot: e2e/out/07-map
