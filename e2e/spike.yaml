# Spike E2E (Android, physical device, airplane mode, English UI; content and questions are Greek).
# search -> open article -> ask -> citation chip -> article -> unrelated question (no source) -> map
# Run: e2e/run-spike.ps1 (sets MAESTRO_CLI_NO_ANALYTICS, collects logcat + blocked-request log).
# APP_ID: org.skepi.app (release, default in run-spike.ps1) or org.skepi.app.dev (debug).
appId: ${APP_ID}
name: SKEPI spike (offline)
env:
  SEARCH_QUERY: Πάτρα
  ASK_QUESTION: Πού βρίσκεται η Πάτρα και πόσους κατοίκους έχει;
  EXPECTED_ARTICLE: Πάτρα
  UNRELATED_QUESTION: Ποια είναι η καλύτερη συνταγή για σουφλέ τρούφας;
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true

# 1. Search: suggestions while typing, full-text on submit
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 30000
- assertVisible: "Search"
- assertVisible: "Ask"
- assertVisible: "Map"
- tapOn:
    id: search-input
- inputText: ${SEARCH_QUERY}
- extendedWaitUntil:
    visible:
      id: search-timing
    timeout: 10000
- tapOn:
    id: search-fulltext
- extendedWaitUntil:
    visible:
      text: "fulltext:.*"
    timeout: 10000
- takeScreenshot: e2e/out/01-search

# 2. Open the first result in the sealed zim:// viewer
- tapOn:
    id: search-result-0
- extendedWaitUntil:
    visible:
      text: "Opened in .*"
    timeout: 15000
- assertVisible:
    id: article-view
- assertVisible: "Blocked requests: 0"
- takeScreenshot: e2e/out/02-article
- back

# 3. Ask: grounded answer with at least one valid citation chip
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: ask-metrics
    timeout: 180000
- assertVisible:
    id: citation-S1
- assertNotVisible:
    id: answer-unverified
- takeScreenshot: e2e/out/03-answer

# 4. Citation chip opens the cited article
- tapOn:
    id: citation-S1
- extendedWaitUntil:
    visible:
      text: "Opened in .*"
    timeout: 15000
- assertVisible: ${EXPECTED_ARTICLE}
- assertVisible: "Blocked requests: 0"
- takeScreenshot: e2e/out/04-cited-article
- back

# 5. Unrelated question: "no source found" without generation
- tapOn:
    id: ask-clear
- tapOn:
    id: ask-input
- inputText: ${UNRELATED_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: no-source
    timeout: 60000
- assertNotVisible:
    id: answer-text
- assertVisible: "Reason: .*no generation"
- assertVisible: ${UNRELATED_QUESTION}
- takeScreenshot: e2e/out/05-no-source

# 6. Offline map (PMTiles from local file, Greek labels)
- tapOn:
    id: tab-map
- extendedWaitUntil:
    visible:
      text: "Map ready.*"
    timeout: 60000
- takeScreenshot: e2e/out/06-map
