# Store screenshots (F-Droid / Play phoneScreenshots), Developer Preview release build on the
# skepi-host emulator (1080x2400, 420 dpi) with provisioned packs, airplane mode, system UI demo mode
# (clean status bar). Run: e2e/run-screenshots.ps1, which writes
# fastlane/metadata/android/en-US/images/phoneScreenshots/{1..6}_*.png and checks the size.
# Preview builds carry no emergency card steps; no screen here opens a card.
appId: ${APP_ID}
name: SKEPI store screenshots
env:
  SEARCH_QUERY: Water purification
  ASK_QUESTION: How do I purify water?
  OUT: fastlane/metadata/android/en-US/images/phoneScreenshots
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml

# 1. Home: search, emergency button, tabs
- extendedWaitUntil:
    visible:
      id: home-emergency
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/1_home

# 2. Search: full-text results
- tapOn:
    id: search-input
- inputText: ${SEARCH_QUERY}
- tapOn:
    id: search-fulltext
- extendedWaitUntil:
    visible:
      id: search-result-0
    timeout: 20000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/2_search

# 3. Article in the sealed offline viewer
- tapOn:
    id: search-result-0
- extendedWaitUntil:
    visible:
      text: "Opened in .*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/3_article
- back

# 4. Ask: source excerpts with their sources (Layer 1; no model needed)
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: layer1-passage-0
    timeout: 30000
- tapOn:
    id: ask-stop
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/4_ask_sources

# 5. Offline map
- tapOn:
    id: tab-map
- extendedWaitUntil:
    visible:
      text: "Map ready.*"
    timeout: 120000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${OUT}/5_map

# 6. Offline tools: SOS torch, compass, coordinates
- tapOn:
    id: tab-tools
- extendedWaitUntil:
    visible:
      id: tools-screen
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${OUT}/6_tools
