# Tools (release build, airplane mode): GNSS fix (location permission granted by run-e2e.ps1; the first
# fix without A-GPS can take minutes) and the SMS hand-off, which only opens the SMS app with the text
# filled in (nothing is sent); then the SOS torch, red screen SOS and compass. -SimulateGnss feeds the gps
# provider from a shell test provider when the phone has no sky view. The location steps come first:
# on the S23, test-provider positions stopped arriving once the torch had been switched on.
appId: ${APP_ID}
name: SKEPI tools (offline)
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- tapOn:
    id: tab-tools
- extendedWaitUntil:
    visible:
      id: tools-screen
    timeout: 10000
# Location: one fix on tap
- scrollUntilVisible:
    element:
      id: location-locate
    direction: DOWN
    timeout: 10000
- tapOn:
    id: location-locate
- extendedWaitUntil:
    notVisible:
      id: location-locating
    timeout: 300000
- scrollUntilVisible:
    element:
      id: location-fix
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: location-decimal
- takeScreenshot: e2e/out/tools-01-fix
- scrollUntilVisible:
    element:
      id: location-sms
    direction: DOWN
    timeout: 10000
- tapOn:
    id: location-sms
# The SMS app opens (Samsung Messages asks for the recipient first, with the text kept). No screenshot
# here: that screen shows the phone's contacts. run-e2e.ps1 checks the VIEW sms: intent in logcat.
- extendedWaitUntil:
    notVisible:
      id: tools-screen
    timeout: 15000
- launchApp:
    stopApp: false
- tapOn:
    id: tab-tools
- extendedWaitUntil:
    visible:
      id: tools-screen
    timeout: 15000
# SOS torch and red screen
- scrollUntilVisible:
    element:
      id: sos-torch-start
    direction: UP
    timeout: 10000
- tapOn:
    id: sos-torch-start
- extendedWaitUntil:
    visible:
      id: sos-torch-running
    timeout: 5000
- takeScreenshot: e2e/out/tools-02-torch
- tapOn:
    id: sos-torch-stop
- assertVisible:
    id: sos-torch-start
- tapOn:
    id: sos-screen-red
- extendedWaitUntil:
    visible:
      id: sos-screen
    timeout: 5000
- takeScreenshot: e2e/out/tools-03-red-screen
- tapOn:
    id: sos-screen
- extendedWaitUntil:
    visible:
      id: tools-screen
    timeout: 5000
# Compass
- scrollUntilVisible:
    element:
      id: compass-start
    direction: DOWN
    timeout: 10000
- tapOn:
    id: compass-start
- scrollUntilVisible:
    element:
      id: compass-heading
    direction: DOWN
    timeout: 15000
- takeScreenshot: e2e/out/tools-04-compass
- tapOn:
    id: compass-stop
