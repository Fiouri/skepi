# T1-simulation flow: the developer switch forces the T1 profile; Layer 1 shows and the AI summary
# waits for "Summarise with AI". The switch is persisted (app.db): the flow sets it and resets it.
appId: ${APP_ID}
name: SKEPI T1-simulation flow (offline)
env:
  ASK_QUESTION: Where is the Great Barrier Reef?
onFlowComplete:
  - runFlow: set-t1-off.yaml
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- extendedWaitUntil:
    visible:
      id: tab-bench
    timeout: 30000
- runFlow: set-t1-on.yaml
- assertVisible: ".*mode t1-simulation.*summary on-demand.*"
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-t1-simulation
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: layer1-passage-0
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: ask-summarise
    direction: DOWN
    timeout: 20000
- assertVisible: "Summarise with AI"
- assertNotVisible:
    id: ai-summary
- takeScreenshot: e2e/out/t1-01-layer1
- tapOn:
    id: ask-summarise
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 300000
- scrollUntilVisible:
    element:
      id: answer-sentence-0
    direction: DOWN
    timeout: 20000
- assertVisible: "AI summary — check the source"
- assertVisible:
    id: "citation-S[0-9]+"
- takeScreenshot: e2e/out/t1-02-ai-summary
