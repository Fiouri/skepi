# Medical flow: the emergency number and Layer 1 only; never an AI summary, not even on tap (decision
# 2026-10-21), with the one-line note "AI summaries are not available for medical questions."
appId: ${APP_ID}
name: SKEPI medical flow (offline)
env:
  ASK_QUESTION: What does insulin do?
onFlowComplete:
  - setAirplaneMode: disabled
---
- setAirplaneMode: enabled
- launchApp:
    stopApp: true
- runFlow: app-ready.yaml
- extendedWaitUntil:
    visible:
      id: tab-ask
    timeout: 30000
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-input
- inputText: ${ASK_QUESTION}
- hideKeyboard
- tapOn:
    id: ask-submit
- extendedWaitUntil:
    visible:
      id: medical-notice
    timeout: 15000
- assertVisible: "Medical question. In an emergency call 112.*"
- extendedWaitUntil:
    visible:
      id: layer1-passage-0
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: ask-phase
      text: "done"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: summary-medical
    direction: DOWN
    timeout: 20000
- assertVisible: "AI summaries are not available for medical questions."
- assertNotVisible:
    id: ask-summarise
- assertNotVisible:
    id: ai-summary
- takeScreenshot: e2e/out/med-01-layer1-no-ai
